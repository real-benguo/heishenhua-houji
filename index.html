    <meta name="theme-color" content="#07090a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta property="og:title" content="黑神话：猴急 · BLACK MYTH: MONKEY RUSH" />

  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div class="boot-mark">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle cx="60" cy="60" r="54" fill="none" stroke="currentColor" stroke-width="1" opacity=".35" />
          <circle cx="60" cy="60" r="45" fill="none" stroke="currentColor" stroke-width=".5" stroke-dasharray="2 6" opacity=".3" />
          <text x="60" y="79" text-anchor="middle" font-size="56" fill="currentColor" font-family="serif">猴</text>
        </svg>
      </div>
      <div class="boot-title">黑神话 <span>·</span> 猴急</div>
      <div class="boot-sub">BLACK MYTH : MONKEY RUSH</div>
      <div class="boot-line"><i></i></div>
      <div class="boot-status">正在唤醒一只不想上班的猴子……</div>
      <div class="boot-legal">非官方恶搞同人作品 · 与《黑神话：悟空》及游戏科学无关</div>
    </div>
    <div id="app">
      <canvas id="game-canvas" aria-label="黑神话猴急 3D 游戏画面"></canvas>
      <div id="ui-root"></div>
      <div id="fade-layer" aria-hidden="true"></div>
      <div id="grain" aria-hidden="true"></div>
      <div id="rotate-overlay" aria-hidden="true">
        <div class="rotate-card">
          <div class="rotate-icon" aria-hidden="true"><i></i></div>
          <div class="rotate-title">请横屏，猴命关天</div>
          <div class="rotate-sub">竖屏也能玩，但猴子会显得很长。</div>
          <button class="rotate-anyway" id="rotate-anyway">我就要竖着玩</button>
        </div>
      </div>
    </div>
    <noscript>请启用 JavaScript 以进入花果山人才市场。</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
